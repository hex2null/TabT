# TabT color themes.
#
# TabT ships this file inside its application bundle (Contents/Resources/themes.conf) as the
# read-only default, and copies it to ~/.tabt/themes.conf on first run. That copy is yours to
# edit and is never rewritten by the app: every [theme] section below is one entry of the Theme
# pop-up, in this order. It is read once at startup, so an edit takes effect the next time TabT
# is launched. Deleting your copy restores this one; editing the copy inside the bundle instead
# only breaks the app's code signature.
#
# Colors are #rrggbb (the leading # is optional, and #rgb shorthand works too).
#
#   name       the label shown in Settings, and what layout.conf stores
#   fg / bg    default text and background color
#   mono       true = monochrome phosphor screen: SGR colors are ignored and all text
#              is drawn in fg, so color0..color15 are unused
#   color0..15 the ANSI 16 (0-7 normal, 8-15 bright)
#
# A missing or unparseable value falls back to the built-in base theme's.
#
# Twelve schemes: the six dark ones first, the six light ones after. Each is its upstream
# project's own terminal palette rather than a re-tint of one.

# ----------------------------------------------------------------- dark

